name: palcord

# 팰월드 디스코드 봇 (palcord).
# - 팰월드 컨테이너와 같은 도커 네트워크에 붙어 REST API(http://palworld:8212)를 직접 호출.
# - 호스트 도커 소켓을 마운트해서 !!열기/닫기/재시작(컨테이너 제어)을 수행.
# - .env 필수: TOKEN_BOT, TOKEN_SERVER, PAL_API_PASSWORD (.env.example 참조)

services:
  palcord:
    build: .
    image: palcord:latest
    container_name: palcord
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
    networks: [palworld]

networks:
  palworld:
    external: true
    name: palworld_default
